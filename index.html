<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADA BENGSIN - Cari SPBU & BBM Terdekat</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#dc2626">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    #map { height: calc(100vh - 64px - 60px); width: 100%; }
  </style>
</head>
<body class="bg-gray-100 flex flex-col h-screen overflow-hidden">

  <!-- Header / Navbar -->
  <header class="bg-red-600 text-white p-4 shadow-md flex justify-between items-center z-10">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-gas-pump text-2xl text-yellow-300"></i>
      <h1 class="font-bold text-xl tracking-wide">ADA BENGSIN</h1>
    </div>
    <div id="user-status-bar" class="text-xs bg-red-700 px-3 py-1 rounded-full flex items-center gap-1">
      <i class="fa-solid fa-user-slash"></i> Guest
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 relative">
    <!-- View Peta -->
    <div id="view-map" class="w-full h-full relative">
      <div id="map"></div>
      
      <!-- Indicator Loading POI -->
      <div id="poi-loader" class="hidden absolute top-3 right-3 bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-full shadow-md text-xs text-gray-700 z-[1000] flex items-center gap-2 border">
        <i class="fa-solid fa-spinner fa-spin text-red-600"></i> Memuat POI...
      </div>

      <!-- Tombol Positioning -->
      <button onclick="centerUserLocation()" title="Kembali ke Lokasi Saya" 
              class="absolute bottom-5 right-5 bg-white text-gray-700 w-11 h-11 rounded-full shadow-xl border border-gray-200 flex items-center justify-center z-[1000] hover:bg-gray-50 active:scale-95 transition-all">
        <i class="fa-solid fa-crosshairs text-lg text-red-600"></i>
      </button>
    </div>

    <!-- View Form Tambah Lokasi -->
    <div id="view-add" class="hidden absolute inset-0 bg-white p-4 overflow-y-auto z-20">
      <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-map-pin text-red-600"></i> Tambah Lokasi BBM Baru
      </h2>
      <p class="text-xs text-gray-500 mb-4">Geser peta untuk menentukan titik koordinat lokasi yang tepat.</p>
      
      <div id="picker-map" class="h-48 w-full rounded-lg mb-4 border"></div>

      <form id="form-add-location" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600">Latitude</label>
            <input type="text" id="add-lat" readonly class="w-full p-2 border rounded bg-gray-100 text-xs">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600">Longitude</label>
            <input type="text" id="add-lng" readonly class="w-full p-2 border rounded bg-gray-100 text-xs">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600">Nama Tempat / Penjual</label>
          <input type="text" id="add-nama" required placeholder="Contoh: SPBU Simpang KTA / Eceran Pak Budi" class="w-full p-2 border rounded text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600">Kategori</label>
          <select id="add-kategori" class="w-full p-2 border rounded text-sm bg-white">
            <option value="SPBU">SPBU Official</option>
            <option value="Pertashop">Pertashop</option>
            <option value="Eceran">Penjual Eceran</option>
            <option value="SPKLU">SPKLU (Charging Station)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600">Jenis BBM / Power Tersedia</label>
          <input type="text" id="add-bbm" placeholder="Pertalite, Pertamax, Solar, EV Fast Charging" class="w-full p-2 border rounded text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600">Patokan / Catatan Alamat</label>
          <textarea id="add-catatan" rows="2" placeholder="Samping toko kelontong, spanduk warna merah" class="w-full p-2 border rounded text-sm"></textarea>
        </div>

        <button type="submit" class="w-full bg-red-600 text-white py-2 rounded-lg font-semibold hover:bg-red-700 shadow">
          Simpan Lokasi
        </button>
      </form>
    </div>

    <!-- View Auth (Login & Daftar) -->
    <div id="view-auth" class="hidden absolute inset-0 bg-white p-6 overflow-y-auto z-20">
      <div id="auth-logged-in" class="hidden text-center py-8">
        <i class="fa-solid fa-circle-user text-6xl text-red-600 mb-3"></i>
        <h3 id="logged-user-name" class="text-xl font-bold text-gray-800"></h3>
        <p id="logged-user-status" class="text-sm text-green-600 font-semibold mb-6"></p>
        <button onclick="logout()" class="bg-gray-200 text-gray-800 px-6 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300">
          Logout / Keluar
        </button>
      </div>

      <div id="auth-forms">
        <!-- Login Form -->
        <div id="form-login-box">
          <h2 class="text-xl font-bold text-gray-800 mb-4">Login Pengguna</h2>
          <form id="form-login" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-gray-600">Username</label>
              <input type="text" id="login-username" required class="w-full p-2 border rounded text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600">Password</label>
              <input type="password" id="login-password" required class="w-full p-2 border rounded text-sm">
            </div>
            <button type="submit" class="w-full bg-red-600 text-white py-2 rounded-lg font-semibold hover:bg-red-700">
              Masuk
            </button>
          </form>
          <p class="text-xs text-center text-gray-500 mt-4">
            Belum punya akun? <a href="#" onclick="toggleAuthMode('register')" class="text-red-600 font-semibold">Daftar Sekarang</a>
          </p>
        </div>

        <!-- Register Form -->
        <div id="form-register-box" class="hidden">
          <h2 class="text-xl font-bold text-gray-800 mb-4">Daftar Akun Baru</h2>
          <form id="form-register" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-gray-600">Nama Lengkap</label>
              <input type="text" id="reg-nama" required class="w-full p-2 border rounded text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600">Username</label>
              <input type="text" id="reg-username" required placeholder="Huruf/angka/underscore (min. 4 kar)" class="w-full p-2 border rounded text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600">No. WhatsApp</label>
              <input type="tel" id="reg-wa" placeholder="08123456789" required class="w-full p-2 border rounded text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600">Password</label>
              <input type="password" id="reg-password" required placeholder="Minimal 6 karakter" class="w-full p-2 border rounded text-sm">
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700">
              Daftar Akun
            </button>
          </form>
          <p class="text-xs text-center text-gray-500 mt-4">
            Sudah punya akun? <a href="#" onclick="toggleAuthMode('login')" class="text-red-600 font-semibold">Login</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bg-white border-t border-gray-200 flex justify-around items-center h-15 p-2 z-30">
    <button onclick="switchTab('map')" id="nav-map" class="flex flex-col items-center text-red-600">
      <i class="fa-solid fa-map text-lg"></i>
      <span class="text-[10px] mt-1 font-semibold">Peta POI</span>
    </button>
    <button onclick="switchTab('add')" id="nav-add" class="flex flex-col items-center text-gray-500">
      <i class="fa-solid fa-circle-plus text-lg"></i>
      <span class="text-[10px] mt-1 font-semibold">Tambah</span>
    </button>
    <button onclick="switchTab('auth')" id="nav-auth" class="flex flex-col items-center text-gray-500">
      <i class="fa-solid fa-user text-lg"></i>
      <span class="text-[10px] mt-1 font-semibold">Akun</span>
    </button>
  </nav>

  <script>
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzgKU5dvNVXljApdL6FVGjv7jSMMx-FTYjs2V6-aeBQgJG7hyZZnA4HDTMClVEpgK5yXw/exec';
    const GEOAPIFY_API_KEY = ''; 

    let map, pickerMap, userMarker, pickerMarker;
    let currentUserLatLng = null;
    let poiDbGroup, poiExternalGroup; 
    let loadedPoiIds = new Set();
    let poiDebounceTimer = null;
    let currentUser = JSON.parse(localStorage.getItem('ada_bengsin_user')) || null;

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      updateUserUI();
      registerSW();
    });

    function registerSW() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      }
    }

    function initMap() {
      const defaultLat = -0.502181;
      const defaultLng = 117.153801;

      map = L.map('map').setView([defaultLat, defaultLng], 13);

      // Gunakan OpenStreetMap Standard Tile (Gratis & Bebas API Key)
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      poiDbGroup = L.layerGroup().addTo(map);
      poiExternalGroup = L.layerGroup().addTo(map);

      trackUserLocation();
      loadLocationsFromDb();

      map.on('moveend', () => {
        clearTimeout(poiDebounceTimer);
        poiDebounceTimer = setTimeout(fetchExternalPoiInView, 600);
      });

      fetchExternalPoiInView();
    }

    function trackUserLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          currentUserLatLng = [pos.coords.latitude, pos.coords.longitude];
          map.setView(currentUserLatLng, 14);
          
          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.marker(currentUserLatLng, {
            icon: L.divIcon({
              className: 'custom-user-icon',
              html: `<div class="bg-blue-600 text-white rounded-full p-2 w-8 h-8 flex items-center justify-center shadow-lg border-2 border-white"><i class="fa-solid fa-location-crosshairs text-sm"></i></div>`
            })
          }).addTo(map).bindPopup('<b>Lokasi Anda Saat Ini</b>');
        }, err => console.log('Akses lokasi ditolak/gagal:', err));
      }
    }

    function centerUserLocation() {
      if (currentUserLatLng) {
        map.flyTo(currentUserLatLng, 15, { duration: 1.2 });
      } else if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          currentUserLatLng = [pos.coords.latitude, pos.coords.longitude];
          map.flyTo(currentUserLatLng, 15, { duration: 1.2 });
        }, () => alert('Tidak dapat mendeteksi lokasi Anda. Pastikan GPS aktif.'));
      } else {
        alert('Fitur Geolocation tidak didukung browser Anda.');
      }
    }

    function loadLocationsFromDb() {
      const loader = document.getElementById('poi-loader');
      if (loader) loader.classList.remove('hidden');

      fetch(`${GAS_WEB_APP_URL}?action=getLocations`, { 
        method: 'GET',
        mode: 'cors',
        redirect: 'follow'
      })
        .then(res => {
          if (!res.ok) throw new Error('HTTP status ' + res.status);
          return res.json();
        })
        .then(res => {
          if (loader) loader.classList.add('hidden');
          if (res.status === 'success' && Array.isArray(res.data)) {
            poiDbGroup.clearLayers();
            
            res.data.forEach(loc => {
              const lat = parseFloat(loc.latitude);
              const lng = parseFloat(loc.longitude);

              if (isNaN(lat) || isNaN(lng)) return;

              let color = 'bg-red-600';
              let iconClass = 'fa-gas-pump';
              
              if (loc.kategori === 'Pertashop') color = 'bg-green-600';
              if (loc.kategori === 'Eceran') color = 'bg-amber-500';
              if (loc.kategori === 'SPKLU') {
                color = 'bg-blue-600';
                iconClass = 'fa-charging-station';
              }

              const icon = L.divIcon({
                className: 'custom-poi-icon',
                html: `<div class="${color} text-white rounded-full p-2 w-8 h-8 flex items-center justify-center shadow-md border border-white"><i class="fa-solid ${iconClass} text-xs"></i></div>`
              });

              const popupContent = `
                <div class="p-1">
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded text-white ${color}">${loc.kategori}</span>
                  <h4 class="font-bold text-sm mt-1 text-gray-800">${loc.nama_tempat}</h4>
                  <p class="text-xs text-gray-600 mt-1"><b>Tersedia:</b> ${loc.jenis_bbm}</p>
                  <p class="text-xs text-gray-500 mt-0.5"><b>Patokan:</b> ${loc.alamat_catatan}</p>
                  <a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank" 
                     class="mt-2 block text-center bg-blue-600 text-white text-xs py-1 px-2 rounded font-semibold hover:bg-blue-700">
                    <i class="fa-solid fa-route"></i> Navigasi Rute
                  </a>
                </div>
              `;

              L.marker([lat, lng], { icon: icon })
                .bindPopup(popupContent)
                .addTo(poiDbGroup);
            });
          }
        })
        .catch(err => {
          if (loader) loader.classList.add('hidden');
          console.error('Gagal memuat POI DB:', err);
        });
    }

    function fetchExternalPoiInView() {
  if (map.getZoom() < 11) return;

  const loader = document.getElementById('poi-loader');
  if (loader) loader.classList.remove('hidden');

  const bounds = map.getBounds();
  const s = bounds.getSouth().toFixed(4);
  const w = bounds.getWest().toFixed(4);
  const n = bounds.getNorth().toFixed(4);
  const e = bounds.getEast().toFixed(4);

  // Kueri mencakup 'node' dan 'way' (bangunan/area) untuk SPBU & SPKLU
  const query = `[out:json][timeout:15];(node["amenity"="fuel"](${s},${w},${n},${e});way["amenity"="fuel"](${s},${w},${n},${e});node["amenity"="charging_station"](${s},${w},${n},${e});way["amenity"="charging_station"](${s},${w},${n},${e}););out center;`;

  const mirrors = [
    "https://overpass.kumi.systems/api/interpreter",
    "https://overpass.openstreetmap.fr/api/interpreter",
    "https://overpass-api.de/api/interpreter"
  ];

  function tryFetchMirror(index) {
    if (index >= mirrors.length) {
      if (loader) loader.classList.add('hidden');
      if (typeof GEOAPIFY_API_KEY !== 'undefined' && GEOAPIFY_API_KEY) {
        fetchGeoapifyPoi(s, w, n, e);
      }
      return;
    }

    const url = mirrors[index] + "?data=" + encodeURIComponent(query);

    fetch(url)
      .then(res => {
        if (!res.ok) throw new Error('HTTP status ' + res.status);
        return res.json();
      })
      .then(data => {
        if (loader) loader.classList.add('hidden');
        if (!data || !data.elements) return;

        data.elements.forEach(el => {
          const poiUniqueKey = 'osm-' + el.type + '-' + el.id;
          if (loadedPoiIds.has(poiUniqueKey)) return;
          loadedPoiIds.add(poiUniqueKey);

          // Tentukan Koordinat (node pakai el.lat/el.lon, way pakai el.center.lat/el.center.lon)
          const lat = el.lat || (el.center ? el.center.lat : null);
          const lon = el.lon || (el.center ? el.center.lon : null);

          if (!lat || !lon) return;

          let rawName = (el.tags && el.tags.name) ? el.tags.name : '';
          let isCharging = el.tags && el.tags.amenity === 'charging_station';

          let kategori = 'SPBU';
          let color = 'bg-red-600';
          let iconClass = 'fa-gas-pump';

          if (isCharging) {
            kategori = 'SPKLU';
            color = 'bg-blue-600';
            iconClass = 'fa-charging-station';
            if (!rawName) rawName = 'SPKLU Charging Station';
          } else if (rawName.toLowerCase().includes('pertashop')) {
            kategori = 'Pertashop';
            color = 'bg-green-600';
          } else {
            if (!rawName) rawName = 'SPBU / Penjual BBM';
          }

          renderExternalMarker(lat, lon, rawName, kategori, color, iconClass, 'OpenStreetMap');
        });
      })
      .catch(() => tryFetchMirror(index + 1));
  }

  tryFetchMirror(0);
}

    function fetchGeoapifyPoi(s, w, n, e) {
      const geoUrl = `https://api.geoapify.com/v2/places?categories=service.fuel,service.vehicle.charging_station&filter=rect:${w},${n},${e},${s}&limit=50&apiKey=${GEOAPIFY_API_KEY}`;
      
      fetch(geoUrl)
        .then(res => res.json())
        .then(data => {
          if (!data || !data.features) return;

          data.features.forEach(f => {
            const props = f.properties;
            const id = 'geo-' + props.place_id;
            
            if (loadedPoiIds.has(id)) return;
            loadedPoiIds.add(id);

            const lat = props.lat;
            const lon = props.lon;
            let name = props.name || 'SPBU / Tempat Isi BBM';
            let isCharging = props.categories.includes('service.vehicle.charging_station');

            let kategori = isCharging ? 'SPKLU' : (name.toLowerCase().includes('pertashop') ? 'Pertashop' : 'SPBU');
            let color = isCharging ? 'bg-blue-600' : (kategori === 'Pertashop' ? 'bg-green-600' : 'bg-red-600');
            let iconClass = isCharging ? 'fa-charging-station' : 'fa-gas-pump';

            renderExternalMarker(lat, lon, name, kategori, color, iconClass, 'Geoapify Places');
          });
        })
        .catch(console.error);
    }

    function renderExternalMarker(lat, lon, name, kategori, color, iconClass, sourceName) {
      const icon = L.divIcon({
        className: 'custom-ext-icon',
        html: `<div class="${color} text-white rounded-full p-2 w-8 h-8 flex items-center justify-center shadow-md border border-white"><i class="fa-solid ${iconClass} text-xs"></i></div>`
      });

      const popupContent = `
        <div class="p-1">
          <span class="text-[10px] font-bold px-2 py-0.5 rounded text-white ${color}">${kategori} (${sourceName})</span>
          <h4 class="font-bold text-sm mt-1 text-gray-800">${name}</h4>
          <p class="text-xs text-gray-500 mt-1">Sumber: ${sourceName}</p>
          <a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}" target="_blank" 
             class="mt-2 block text-center bg-blue-600 text-white text-xs py-1 px-2 rounded font-semibold hover:bg-blue-700">
            <i class="fa-solid fa-route"></i> Navigasi Rute
          </a>
        </div>
      `;

      L.marker([lat, lon], { icon: icon })
        .bindPopup(popupContent)
        .addTo(poiExternalGroup);
    }

    function initPickerMap() {
      if (pickerMap) {
        pickerMap.invalidateSize();
        return;
      }

      const center = map.getCenter();
      pickerMap = L.map('picker-map').setView([center.lat, center.lng], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(pickerMap);

      pickerMarker = L.marker([center.lat, center.lng], { draggable: true }).addTo(pickerMap);

      document.getElementById('add-lat').value = center.lat.toFixed(6);
      document.getElementById('add-lng').value = center.lng.toFixed(6);

      pickerMarker.on('dragend', function () {
        const coord = pickerMarker.getLatLng();
        document.getElementById('add-lat').value = coord.lat.toFixed(6);
        document.getElementById('add-lng').value = coord.lng.toFixed(6);
      });

      pickerMap.on('click', function(e) {
        pickerMarker.setLatLng(e.latlng);
        document.getElementById('add-lat').value = e.latlng.lat.toFixed(6);
        document.getElementById('add-lng').value = e.latlng.lng.toFixed(6);
      });
    }

    function switchTab(tab) {
      document.getElementById('view-map').classList.add('hidden');
      document.getElementById('view-add').classList.add('hidden');
      document.getElementById('view-auth').classList.add('hidden');

      document.getElementById('nav-map').className = "flex flex-col items-center text-gray-500";
      document.getElementById('nav-add').className = "flex flex-col items-center text-gray-500";
      document.getElementById('nav-auth').className = "flex flex-col items-center text-gray-500";

      if (tab === 'map') {
        document.getElementById('view-map').classList.remove('hidden');
        document.getElementById('nav-map').className = "flex flex-col items-center text-red-600";
        setTimeout(() => map.invalidateSize(), 100);
      } else if (tab === 'add') {
        if (!currentUser) {
          alert('Anda harus login terlebih dahulu untuk menambah lokasi!');
          switchTab('auth');
          return;
        }
        document.getElementById('view-add').classList.remove('hidden');
        document.getElementById('nav-add').className = "flex flex-col items-center text-red-600";
        setTimeout(initPickerMap, 200);
      } else if (tab === 'auth') {
        document.getElementById('view-auth').classList.remove('hidden');
        document.getElementById('nav-auth').className = "flex flex-col items-center text-red-600";
      }
    }

    function toggleAuthMode(mode) {
      if (mode === 'register') {
        document.getElementById('form-login-box').classList.add('hidden');
        document.getElementById('form-register-box').classList.remove('hidden');
      } else {
        document.getElementById('form-login-box').classList.remove('hidden');
        document.getElementById('form-register-box').classList.add('hidden');
      }
    }

    function updateUserUI() {
      const statusBar = document.getElementById('user-status-bar');
      if (currentUser) {
        statusBar.innerHTML = `<i class="fa-solid fa-user-check"></i> ${currentUser.username} (${currentUser.status})`;
        document.getElementById('auth-forms').classList.add('hidden');
        document.getElementById('auth-logged-in').classList.remove('hidden');
        document.getElementById('logged-user-name').innerText = currentUser.nama_lengkap;
        document.getElementById('logged-user-status').innerText = `Status Akun: ${currentUser.status}`;
      } else {
        statusBar.innerHTML = `<i class="fa-solid fa-user-slash"></i> Guest`;
        document.getElementById('auth-forms').classList.remove('hidden');
        document.getElementById('auth-logged-in').classList.add('hidden');
      }
    }

    function logout() {
      localStorage.removeItem('ada_bengsin_user');
      currentUser = null;
      updateUserUI();
      switchTab('map');
    }

    function sendGasPost(payload) {
      return fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(res => res.json());
    }

    document.getElementById('form-register').addEventListener('submit', e => {
      e.preventDefault();

      const usernameInput = document.getElementById('reg-username').value.trim();
      const passwordInput = document.getElementById('reg-password').value;
      const namaInput = document.getElementById('reg-nama').value.trim();
      const waInput = document.getElementById('reg-wa').value.trim();

      const usernameRegex = /^[a-zA-Z0-9_]{4,20}$/;
      if (!usernameRegex.test(usernameInput)) {
        alert('Username harus 4-20 karakter dan hanya boleh huruf, angka, atau underscore (_). Tanpa spasi!');
        return;
      }

      if (passwordInput.length < 6) {
        alert('Password minimal harus 6 karakter!');
        return;
      }

      const waRegex = /^[0-9]{10,15}$/;
      if (!waRegex.test(waInput)) {
        alert('Nomor WhatsApp tidak valid! Masukkan 10-15 digit angka.');
        return;
      }

      const payload = {
        action: 'register',
        data: {
          nama_lengkap: namaInput,
          username: usernameInput.toLowerCase(),
          no_whatsapp: waInput,
          password: passwordInput
        }
      };

      sendGasPost(payload)
        .then(res => {
          alert(res.message);
          if (res.status === 'success') toggleAuthMode('login');
        })
        .catch(err => alert('Gagal mendaftar: ' + err));
    });

    document.getElementById('form-login').addEventListener('submit', e => {
      e.preventDefault();
      const payload = {
        action: 'login',
        data: {
          username: document.getElementById('login-username').value.trim().toLowerCase(),
          password: document.getElementById('login-password').value
        }
      };

      sendGasPost(payload)
        .then(res => {
          if (res.status === 'success') {
            currentUser = res.user;
            localStorage.setItem('ada_bengsin_user', JSON.stringify(currentUser));
            updateUserUI();
            switchTab('map');
          } else {
            alert(res.message);
          }
        })
        .catch(err => alert('Gagal login: ' + err));
    });

    document.getElementById('form-add-location').addEventListener('submit', e => {
      e.preventDefault();
      const payload = {
        action: 'addLocation',
        data: {
          username: currentUser.username,
          latitude: document.getElementById('add-lat').value,
          longitude: document.getElementById('add-lng').value,
          nama_tempat: document.getElementById('add-nama').value,
          kategori: document.getElementById('add-kategori').value,
          jenis_bbm: document.getElementById('add-bbm').value,
          alamat_catatan: document.getElementById('add-catatan').value
        }
      };

      sendGasPost(payload)
        .then(res => {
          alert(res.message);
          if (res.status === 'success') {
            switchTab('map');
            loadLocationsFromDb();
          }
        })
        .catch(err => alert('Gagal menambah lokasi: ' + err));
    });
  </script>
</body>
</html>
